
<!DOCTYPE html>
<html>
<head>
    <title>CampusBite</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="3style.css">
</head>

<body>

    <header>
        <h1>CampusBite</h1>
        <p>Fresh Food at Your Campus</p>
    </header>

    <nav>
        <a href="#">Menu</a>
        <a href="#">Specials</a>
        <a href="#">Contact</a>
    </nav>

    <main>

        <section class="banner">
            <h2>Today's Special</h2>
            <img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c"
                 width="600" height="400" alt="Special food">
            <p>Enjoy delicious food at affordable prices!</p>
        </section>

        <section class="menu">

            <div class="card">
                <img src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38"
                     width="600" height="400" alt="Pizza">
                <h3>Pizza</h3>
                <p>Price: ₹100</p>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd"
                     width="600" height="400" alt="Burger">
                <h3>Veg Burger</h3>
                <p>Price: ₹80</p>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1555939594-58d7cb561ad1"
                     width="600" height="400" alt="Sandwich">
                <h3>Sandwich</h3>
                <p>Price: ₹50</p>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1567188040759-fb8a883dc6d8"
                     width="600" height="400" alt="Dosa">
                <h3>Masala Dosa</h3>
                <p>Price: ₹60</p>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1555507036-ab1f4038808a"
                     width="600" height="400" alt="Pastry">
                <h3>Pastry</h3>
                <p>Price: ₹40</p>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1513558161293-cdaf765edfd4"
                     width="600" height="400" alt="Cold drink">
                <h3>Cold Drink</h3>
                <p>Price: ₹30</p>
            </div>

        </section>

    </main>

    <footer>
        <p>© 2026 CampusBite | College Food Corner</p>
    </footer>

</body>
</html>
