
<!DOCTYPE html>
<html>
<head>
    <title>CampusBite</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="5style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>CampusBite</h1>
            <p>College Food Corner</p>
        </header>

        <nav>
            <a href="#">Menu</a>
            <a href="#">Specials</a>
            <a href="#">Contact</a>
        </nav>

        <main>

            <section class="banner">
                <h2>Today's Special</h2>

                <img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c"
                     width="600" height="400"
                     alt="Today's special food">

                <p>Enjoy delicious food at affordable prices!</p>
            </section>

            <section class="menu">

                <div class="card">
                    <h3>Pizza</h3>
                    <p>Price: ₹100</p>
                </div>

                <div class="card">
                    <h3>Veg Burger</h3>
                    <p>Price: ₹80</p>
                </div>

                <div class="card">
                    <h3>Masala Dosa</h3>
                    <p>Price: ₹60</p>
                </div>

            </section>

        </main>

        <footer>
            <p>CampusBite College Food Corner</p>
        </footer>

    </div>

</body>
</html>
